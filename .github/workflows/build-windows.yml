name: Build Windows .exe

on:
  workflow_dispatch:
  release:
    types: [published]

# Least privilege: the build job can only read the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.10"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build yeelight-setup.exe
        run: pyinstaller --onefile --console --clean --name yeelight-setup yeelight_setup.py

      - name: Smoke test
        run: dist\yeelight-setup.exe --version

      - name: SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\yeelight-setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  yeelight-setup.exe" | Out-File -Encoding ascii dist\yeelight-setup.exe.sha256
          Get-Content dist\yeelight-setup.exe.sha256

      - uses: actions/upload-artifact@v6
        with:
          name: yeelight-setup-windows
          path: |
            dist/yeelight-setup.exe
            dist/yeelight-setup.exe.sha256
          if-no-files-found: error

  # Only this small job can write, and it runs no third-party code.
  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: yeelight-setup-windows

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" yeelight-setup.exe yeelight-setup.exe.sha256 --clobber
